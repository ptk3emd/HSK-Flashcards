# Type check, unit tests and production build for every pull request.
name: CI

on:
  pull_request:

  # Also runs on pushes to the default branch
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
